<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card UI Design</title>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- BoxIcons CSS -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>    
</head>

<body>
    <div class="profile-card">
        <div class="image">
            <img src="2023-11-05 (5).png" alt="" class="profile-image">
        </div>

        <div class="text-data">
            <span class="name">Moustafa Hasem</span>
            <span class="job"> Web Developer</span>
        </div>
        <div class="media-buttons">
            <a href="#"  style="background-color: rgba(66, 103, 178, 0.7);"class="link">
                <i class='bx bxl-facebook'></i>
            </a>
            <a href="#"  style="background-color: rgba(29, 161, 242, 0.7);" class="link">
                <i class='bx bxl-twitter' ></i>
            </a> 
            <a href="#"  style="background-color:  rgba(225, 48, 108, 0.7); " class="link">
                <i class='bx bxl-instagram' ></i>
            </a> 
            <a href="#"  style="background-color: rgba(37, 211 ,102 , 0.7) ;" class="link">
                <i class='bx bxl-whatsapp' ></i>
            </a>
        </div>
        <div class="buttons">
            <button class="button">Whatsapp</button>
            <button class="button">Message</button>
        </div>
    </div>
</body>

</html>
